name: Perfil — cobrinha e linguagens

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 em Fortaleza
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cobrinha comendo as contribuições -> dist/*.svg
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-green.svg?color_snake=#e4e4e7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Todas as linguagens de todos os repositórios -> dist/languages.svg
      - name: Gráfico de linguagens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          EXTRA_REPOS: classroom-ufersa/Gerenciamento-de-Fazenda,classroom-ufersa/GnomeSortClientes
        run: python3 scripts/gen-languages.py dist/languages.svg

      # Remove a barra de progresso da cobrinha
      - name: Ajustes nos SVGs
        run: python3 scripts/postprocess.py dist/snake-green.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A dist
          git commit -m "chore: atualiza gráficos do perfil" && git push || echo "nada para atualizar"
