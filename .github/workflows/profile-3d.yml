name: Profile 3D + Snake

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 em Fortaleza
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Calendário de contribuições em 3D -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings.json

      # Cobrinha comendo as contribuições -> dist/*.svg
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-green.svg?color_snake=#e4e4e7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Remove a barra de progresso da cobrinha
        run: |
          python3 - <<'PY'
          import re
          p = "dist/snake-green.svg"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'<rect class="u [^"]*"[^>]*/>', "", s)
          m = re.search(r'viewBox="(-?[\d.]+) (-?[\d.]+) ([\d.]+) ([\d.]+)" width="([\d.]+)" height="([\d.]+)"', s)
          if m:
              x, y, w, h = map(float, m.groups()[:4])
              nh = h - 36
              s = s.replace(m.group(0), f'viewBox="{x:g} {y:g} {w:g} {nh:g}" width="{w:g}" height="{nh:g}"', 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib dist
          git commit -m "chore: atualiza gráficos do perfil" && git push || echo "nada para atualizar"
